name: launchbase

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: launchbase
      POSTGRES_PASSWORD: launchbase
      POSTGRES_DB: launchbase
    # host 5433 because another local postgres already uses 5432
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - launchbase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchbase -d launchbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  # redis is the queue between the api and the worker.
  # those two processes stay on the host: make api, and make worker.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - launchbase
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # dashboard is published on 8088 so it doesn't collide with the api on 8080
  # docker provider watches user containers on launchbase-runtime only
  traefik:
    # v3.6+ negotiates a modern Docker API. Older Traefik images speak 1.24 and
    # fail on current GitHub Actions / Docker Engine hosts (min API 1.40+).
    image: traefik:v3.6
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:80"
      - "8088:8080"
    networks:
      - launchbase-runtime
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:

networks:
  launchbase:
    name: launchbase
  launchbase-runtime:
    name: launchbase-runtime
