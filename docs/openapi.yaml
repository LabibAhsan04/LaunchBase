openapi: 3.0.3
info:
  title: LaunchBase API
  version: 0.10.0
  description: |
    AUTH_MODE=dev (default) acts as the seeded user `local`
    (`00000000-0000-4000-8000-000000000001`) when no session cookie is present.
    AUTH_MODE=github requires a signed-in session for project and deployment APIs
    and repositories linked through a GitHub App installation.

    Sessions use an HTTP-only cookie (`lb_session`). CORS allows credentials from WEB_ORIGIN.
    Creating a deployment stores a QUEUED row and returns immediately.
    A separate worker builds the repository and moves the row to READY or FAILED.
    Private clones use a short-lived GitHub App installation token on the worker only.
    READY deployments are routed by Traefik on `{slug}.launchbase.localhost`.
    Redeploy and rollback queue new immutable deployments; a successful cutover marks
    the previous READY deployment SUPERSEDED.
    Concurrency and per-IP rate limits return 429. See docs/security.md.
    JSON logs, `/metrics`, `/ready`, and traceparent hooks: docs/observability.md.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        "200":
          description: The process is up
          content:
            application/json:
              example:
                status: ok
  /ready:
    get:
      summary: Process readiness
      description: Checks Postgres and Redis. Does not include dependency error details.
      responses:
        "200":
          description: Dependencies reachable
          content:
            application/json:
              example:
                status: ok
        "503":
          description: Not ready
          content:
            application/json:
              example:
                status: not ready
  /metrics:
    get:
      summary: Prometheus text metrics
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/login:
    get:
      summary: Start GitHub OAuth
      responses:
        "302":
          description: Redirect to GitHub
  /api/v1/auth/callback:
    get:
      summary: OAuth callback
      responses:
        "302":
          description: Sets session cookie and redirects to the dashboard
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      summary: Clear session
      responses:
        "200":
          description: Session cleared
  /api/v1/auth/me:
    get:
      summary: Current user
      responses:
        "200":
          description: Session user
          content:
            application/json:
              example:
                id: 00000000-0000-4000-8000-000000000001
                login: local
                displayName: Local Developer
                avatarUrl: ""
                authMode: dev
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/install:
    get:
      summary: Redirect to GitHub App installation
      responses:
        "302":
          description: Redirect to GitHub
  /api/v1/webhooks/github:
    post:
      summary: GitHub App webhooks
      responses:
        "200":
          description: Accepted
        "401":
          description: Signature mismatch
  /api/v1/github/repos:
    get:
      summary: Repositories available through the user's installations
      responses:
        "200":
          description: Authorized repositories
          content:
            application/json:
              example:
                repos:
                  - installationId: 8f1c3b2a-1111-4111-8111-111111111111
                    installationGhid: 123
                    githubRepoId: 456
                    owner: acme
                    name: web
                    fullName: acme/web
                    private: false
                    defaultBranch: main
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/github/repos/{owner}/{repo}/branches:
    get:
      summary: Branches for an authorized repository
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch names
          content:
            application/json:
              example:
                branches: [main, develop]
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/github/installations:
    get:
      summary: Linked GitHub App installations
      responses:
        "200":
          description: Installations for the current user
  /api/v1/projects:
    get:
      summary: List projects for the current user
      responses:
        "200":
          description: Projects, newest first
          content:
            application/json:
              example:
                projects:
                  - id: 6f1c3b2a-1111-4111-8111-111111111111
                    name: Demo
                    slug: demo
                    repoUrl: https://github.com/acme/web.git
                    branch: main
                    createdAt: "2026-10-27T18:00:00Z"
                    updatedAt: "2026-10-27T18:00:00Z"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                fullName:
                  type: string
                  example: acme/web
                  description: Preferred. Must be available through an installation when AUTH_MODE=github.
                repoUrl:
                  type: string
                  example: https://github.com/acme/web
                  description: Allowed in AUTH_MODE=dev when the repo is not yet linked to an installation.
                branch:
                  type: string
                  example: main
      responses:
        "201":
          description: Project created. repoUrl is the normalized https clone URL.
          content:
            application/json:
              example:
                id: 6f1c3b2a-1111-4111-8111-111111111111
                name: Demo
                slug: demo
                repoUrl: https://github.com/acme/web.git
                branch: main
                createdAt: "2026-10-27T18:00:00Z"
                updatedAt: "2026-10-27T18:00:00Z"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}:
    get:
      summary: Get one project and its deployments
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The project
          content:
            application/json:
              example:
                id: 6f1c3b2a-1111-4111-8111-111111111111
                name: Demo
                slug: demo
                repoUrl: https://github.com/acme/web.git
                branch: main
                createdAt: "2026-10-27T18:00:00Z"
                updatedAt: "2026-10-27T18:04:00Z"
                deployments:
                  - id: 7a2d4c3b-2222-4222-8222-222222222222
                    projectId: 6f1c3b2a-1111-4111-8111-111111111111
                    status: READY
                    repoUrl: https://github.com/acme/web.git
                    branch: main
                    image: launchbase/7a2d4c3b-2222-4222-8222-222222222222
                    container: launchbase-7a2d4c3b-2222-4222-8222-222222222222
                    url: http://demo.launchbase.localhost/
                    hostname: demo.launchbase.localhost
                    createdAt: "2026-10-27T18:01:00Z"
                    updatedAt: "2026-10-27T18:04:00Z"
                    finishedAt: "2026-10-27T18:04:00Z"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/deployments:
    post:
      summary: Queue a deployment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  type: string
                  description: Defaults to the project branch.
      responses:
        "201":
          description: The deployment record. status is QUEUED. The worker updates it later.
        "404":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/deployments/{deploymentId}:
    get:
      summary: Get one deployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "200":
          description: The deployment
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/deployments/{deploymentId}/stop:
    post:
      summary: Stop a ready deployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "200":
          description: status is STOPPED
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The deployment is not READY
          content:
            application/json:
              example:
                error:
                  code: conflict
                  message: that status change is not allowed
  /api/v1/deployments/{deploymentId}/redeploy:
    post:
      summary: Queue a new deployment from the project settings
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "201":
          description: New QUEUED deployment
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/deployments/{deploymentId}/rollback:
    post:
      summary: Queue a new deployment from this deployment's immutable repo/branch
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "201":
          description: New QUEUED deployment
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/deployments/{deploymentId}/logs:
    get:
      summary: List stored build logs
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: Return lines with seq greater than this value.
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Bounded history, oldest first
          content:
            application/json:
              example:
                logs:
                  - seq: 1
                    deploymentId: 7a2d4c3b-2222-4222-8222-222222222222
                    ts: "2026-11-11T18:01:01Z"
                    source: system
                    level: info
                    message: status CLONING
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/deployments/{deploymentId}/logs/stream:
    get:
      summary: Stream build logs with Server-Sent Events
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
        - name: after
          in: query
          schema:
            type: integer
            format: int64
          description: Same as Last-Event-ID. Reconnecting clients resume here.
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: |
            text/event-stream. Events are `log`, `heartbeat`, and `done`.
            Each `log` event has an id equal to its seq. Send cookies with credentials.
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          example:
            error:
              code: invalid_request
              message: only https://github.com/owner/repo urls are allowed
