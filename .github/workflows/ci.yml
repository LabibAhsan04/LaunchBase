name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: launchbase
          POSTGRES_PASSWORD: launchbase
          POSTGRES_DB: launchbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launchbase -d launchbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://launchbase:launchbase@localhost:5432/launchbase?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: format
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: vet
        working-directory: backend
        run: go vet ./...
      - name: test
        working-directory: backend
        run: go test -count=1 -coverprofile=coverage.out ./...
      - name: coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -n 1
      - name: migrate check
        working-directory: backend
        run: |
          go run ./cmd/api &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "api never became ready" >&2
          exit 1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: lint
        working-directory: apps/web
        run: pnpm lint
      - name: typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: test
        working-directory: apps/web
        run: pnpm test
      - name: build
        working-directory: apps/web
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build api image
        run: docker build -f backend/Dockerfile --target api -t launchbase-api:ci ./backend
      - name: build worker image
        run: docker build -f backend/Dockerfile --target worker -t launchbase-worker:ci ./backend
