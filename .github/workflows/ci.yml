name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: launchbase
          POSTGRES_PASSWORD: launchbase
          POSTGRES_DB: launchbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launchbase -d launchbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://launchbase:launchbase@localhost:5432/launchbase?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: test
        working-directory: backend
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: lint
        working-directory: apps/web
        run: pnpm lint
      - name: typecheck
        working-directory: apps/web
        run: pnpm typecheck
