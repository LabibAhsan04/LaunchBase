name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  example-routed-url:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: start traefik and runtime network
        run: docker compose up -d traefik
      - name: wait for traefik
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8088/ping >/dev/null; then
              break
            fi
            sleep 1
            if [ "$i" -eq 30 ]; then
              docker compose logs traefik
              exit 1
            fi
          done
          # Confirm the Docker provider can talk to the daemon (not just /ping).
          if docker compose logs traefik 2>&1 | grep -q 'client version .* is too old'; then
            echo "Traefik Docker provider is incompatible with this daemon" >&2
            docker compose logs traefik
            exit 1
          fi
          # Entry point :80 must accept connections before we health-check apps.
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:80/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs traefik
          exit 1
      - name: deploy example through Docker and Traefik
        working-directory: backend
        run: go test -tags=integration -count=1 -timeout 15m ./internal/deployments -run TestExampleNodeDemo
      - name: dump diagnostics on failure
        if: failure()
        run: |
          docker compose logs traefik || true
          docker ps -a || true
      - name: stop compose
        if: always()
        run: docker compose down
