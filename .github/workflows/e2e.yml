name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  example-routed-url:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: start traefik and runtime network
        run: docker compose up -d traefik
      - name: wait for traefik
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8088/ping >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs traefik
          exit 1
      - name: deploy example through Docker and Traefik
        working-directory: backend
        run: go test -tags=integration -count=1 -timeout 15m ./internal/deployments -run TestExampleNodeDemo
      - name: stop compose
        if: always()
        run: docker compose down
