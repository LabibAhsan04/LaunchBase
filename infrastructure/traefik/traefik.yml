# Traefik routes user containers on launchbase-runtime.
# Postgres and Redis stay on the separate launchbase network.
entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: launchbase-runtime
    watch: true

api:
  dashboard: true
  insecure: true

ping: {}
